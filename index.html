<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#F6F2E9">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>عمر وعلا · دعوة زفاف · 26.12.2026</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#EEE8DE}
    .boot{position:fixed;inset:0;background:linear-gradient(180deg,#F0EBE2 0%,#EAE2D7 100%)}
  </style>
</head>
<body>
  <div class="boot" aria-hidden="true"></div>
  <script>
    (async()=>{
      try{
        const response=await fetch('./index-base.html',{cache:'no-cache'});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        let html=await response.text();
        if(!html.includes('js/polish.js')){
          html=html.replace('</head>','  <script defer src="js/polish.js?v=1.0.2"></scr'+'ipt>\n</head>');
        }
        if(!html.includes('js/pass-delivery.js')){
          html=html.replace('</body>','  <script defer src="js/pass-delivery.js?v=1.0.0"></scr'+'ipt>\n</body>');
        }
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error('Invitation bootstrap failed',error);
        location.replace('./index-base.html');
      }
    })();
  </script>
</body>
</html>
